<!doctype html>
<html lang="en">
  <head>
    <script>
      // Global error listener to suppress platform-level and environment-level fetch errors
      (function() {
        try {
          // Catch and suppress the "Cannot set property fetch" of Window error
          window.addEventListener('error', function(event) {
            var msg = event.message || '';
            if (
              msg.indexOf("Cannot set property fetch") > -1 ||
              msg.indexOf("fetch of #<Window>") > -1 ||
              msg.indexOf("fetch has only a getter") > -1 ||
              msg.indexOf("Script error") > -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
          
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason && event.reason.message ? event.reason.message : '';
            if (
              reason.indexOf("Cannot set property fetch") > -1 ||
              reason.indexOf("fetch of #<Window>") > -1 ||
              reason.indexOf("fetch has only a getter") > -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          // Standard onerror override
          var oldOnError = window.onerror;
          window.onerror = function(message, source, lineno, colno, error) {
            var msg = String(message || '');
            if (
              msg.indexOf("Cannot set property fetch") > -1 ||
              msg.indexOf("fetch of #<Window>") > -1 ||
              msg.indexOf("fetch has only a getter") > -1 ||
              msg.indexOf("Script error") > -1
            ) {
              return true; // suppress error
            }
            if (oldOnError) {
              return oldOnError.apply(this, arguments);
            }
          };

          // Safe guard against Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch setter: ", e);
        }
      })();
    </script>
